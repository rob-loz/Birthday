<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱🍕🎂</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #ff6b81;
      --secondary: #4a69bd;
      --bg: #fff5f6;
      --card-bg: #ffffff;
      --text: #2f3542;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* --- CAT & SPEECH BUBBLE CONTAINER --- */
    .greeting-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      margin-top: 20px;
      position: relative;
    }

    /* Speech Bubble */
    .speech-bubble {
      position: relative;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px 22px;
      min-height: 80px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      font-size: 1.15rem;
      line-height: 1.5;
      font-weight: 600;
      text-align: center;
      border: 3px solid var(--primary);
      transition: opacity 0.4s ease;
      opacity: 0; /* Hidden initially */
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 15px 12px 0;
      border-style: solid;
      border-color: var(--primary) transparent;
      display: block;
      width: 0;
    }

    /* SVG Cat Styling */
    .cat-wrapper {
      cursor: pointer;
      width: 200px;
      height: 200px;
      position: relative;
      transition: transform 0.2s ease;
      z-index: 10;
    }

    .cat-wrapper:hover {
      transform: scale(1.05);
    }

    .cat-wrapper:active {
      transform: scale(0.95);
    }

    /* --- MAP SECTION --- */
    .map-section {
      width: 92%;
      max-width: 800px;
      margin: 10px auto 30px auto;
      display: flex; /* Visible by default */
      flex-direction: column;
      align-items: center;
    }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      border: 4px solid white;
    }
    
    /* Cartoony Map Filter */
    .cartoony-tiles {
      filter: saturate(180%) brightness(105%) hue-rotate(-5deg) contrast(1.15) !important;
    }

    /* Custom Cat Map Icon */
    .cat-map-marker-svg {
      width: 45px !important;
      height: 45px !important;
      filter: drop-shadow(0px 5px 4px rgba(0,0,0,0.3));
      margin-left: -22px !important;
      margin-top: -22px !important;
      transition: transform 0.3s ease;
    }
    
    .cat-map-marker-svg:hover {
      transform: scale(1.15) translateY(-5px);
    }

    /* Restaurant Summary Modal/Card */
    .summary-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .summary-card.active {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .summary-card h2 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    .summary-card .tag {
      font-size: 0.85rem;
      color: var(--secondary);
      font-weight: bold;
      margin-bottom: 12px;
      display: block;
    }

    .summary-card p {
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 15px;
      color: #57606f;
    }

    .summary-card a {
      display: inline-block;
      background: var(--secondary);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #a4b0be;
    }

    .backdrop {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.4);
      z-index: 1999;
      display: none;
    }

    .backdrop.active {
      display: block;
    }

    /* --- BOTTOM STICKY TRANSLATE BAR --- */
    .translate-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      padding: 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      display: none; /* Appears after interaction */
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    .translate-options {
      display: none;
      gap: 8px;
    }

    .translate-options.show {
      display: flex;
    }

    .lang-btn {
      background: #f1f2f6;
      border: 2px solid #dfe4ea;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <main class="greeting-stage">
    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
      <span id="speechText"></span>
    </div>

    <!-- Cuter Black & White Tuxedo Cat SVG -->
    <div class="cat-wrapper" id="catHero" onclick="startCatTalking()">
      <svg viewBox="0 0 200 200" width="100%" height="100%" overflow="visible">
        <style>
          .tail { transform-origin: 140px 140px; animation: wag 2.5s infinite ease-in-out; }
          .ear { transform-origin: center; animation: twitch 4s infinite ease-in-out; }
          @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(18deg); } }
          @keyframes twitch { 0%, 90%, 100% { transform: rotate(0deg); } 95% { transform: rotate(-5deg); } }
        </style>
        
        <!-- Tail -->
        <path class="tail" d="M 130 140 Q 180 130 170 80 Q 160 60 150 75 Q 160 100 130 120" fill="#2d3436" />
        
        <!-- Chonky Body -->
        <ellipse cx="100" cy="145" rx="60" ry="50" fill="#2d3436" />
        <!-- White Belly -->
        <ellipse cx="100" cy="155" rx="35" ry="30" fill="#ffffff" />

        <!-- Paws -->
        <ellipse cx="70" cy="190" rx="15" ry="12" fill="#ffffff" />
        <ellipse cx="130" cy="190" rx="15" ry="12" fill="#ffffff" />
        
        <!-- Big Round Head -->
        <ellipse cx="100" cy="85" rx="55" ry="45" fill="#2d3436" />

        <!-- Rounder Ears -->
        <g class="ear" style="transform-origin: 65px 40px;">
          <path d="M 55 60 Q 45 10 75 40 Z" fill="#2d3436" />
          <path d="M 60 55 Q 50 20 70 42 Z" fill="#ffb8b8" />
        </g>
        <g class="ear" style="transform-origin: 135px 40px; animation-delay: 2s;">
          <path d="M 145 60 Q 155 10 125 40 Z" fill="#2d3436" />
          <path d="M 140 55 Q 150 20 130 42 Z" fill="#ffb8b8" />
        </g>

        <!-- Cute White Face Mask -->
        <path d="M 100 115 Q 140 115 145 85 Q 150 70 125 70 Q 100 90 100 90 Q 100 90 75 70 Q 50 70 55 85 Q 60 115 100 115 Z" fill="#ffffff" />

        <!-- Pink Blush -->
        <ellipse cx="65" cy="95" rx="8" ry="5" fill="#ffb8b8" opacity="0.8" />
        <ellipse cx="135" cy="95" rx="8" ry="5" fill="#ffb8b8" opacity="0.8" />

        <!-- Huge Anime Eyes -->
        <ellipse cx="75" cy="75" rx="12" ry="16" fill="#000000" />
        <ellipse cx="125" cy="75" rx="12" ry="16" fill="#000000" />
        <!-- Eye Highlights -->
        <ellipse cx="71" cy="69" rx="4" ry="6" fill="#ffffff" />
        <circle cx="78" cy="82" r="2.5" fill="#ffffff" />
        <ellipse cx="121" cy="69" rx="4" ry="6" fill="#ffffff" />
        <circle cx="128" cy="82" r="2.5" fill="#ffffff" />

        <!-- Tiny Nose -->
        <path d="M 96 90 Q 100 93 104 90 Q 100 87 96 90 Z" fill="#ff758f" />
        
        <!-- :3 Mouth -->
        <path d="M 96 93 Q 100 98 100 95 Q 100 98 104 93" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round" fill="none" />
      </svg>
    </div>
  </main>

  <!-- MAP SECTION (Now visible by default) -->
  <section class="map-section" id="mapSection">
    <div id="map"></div>
  </section>

  <!-- RESTAURANT SUMMARY MODAL -->
  <div class="backdrop" id="backdrop" onclick="closeModal()"></div>
  <div class="summary-card" id="summaryCard">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2 id="resTitle" data-en=""></h2>
    <span class="tag" id="resTag" data-en=""></span>
    <p id="resDesc" data-en=""></p>
    <p id="resAddr" data-en=""></p>
    <br>
    <a id="resLink" data-en="Visit Website / Info ↗" href="#" target="_blank">Visit Website / Info ↗</a>
  </div>

  <!-- PERSISTENT TRANSLATE BAR -->
  <div class="translate-bar" id="translateBar">
    <button class="lang-btn active" id="transMainBtn" data-en="Translate 🌐" onclick="toggleTranslateMenu()">Translate 🌐</button>
    <div class="translate-options" id="translateOptions">
      <button class="lang-btn" data-en="English 🇬🇧" onclick="setLanguage('english')">English 🇬🇧</button>
      <button class="lang-btn active" data-en="Meowish 🐱" onclick="setLanguage('meowish')">Meowish 🐱</button>
      <button class="lang-btn" data-en="Prawnese 🦐" onclick="setLanguage('prawnese')">Prawnese 🦐</button>
    </div>
  </div>

  <!-- Leaflet JS for Map -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- DATA & STATE ---
    const baseSentence = "Happy Birthday Lulu! I am the birthday cat and I am here to show you the way to birthday noms".split(" ");
    
    let currentLang = 'meowish'; // Default initial language as requested
    let isTalking = false;
    let wordIndex = 0;
    let talkInterval = null;
    let displayedWords = [];
    let activeRestaurant = null;

    // Restaurant Data
    const restaurants = [
      {
        id: 1,
        name: "PIQU",
        tag: "Vibrant Thai-Inspired Dining",
        coords: [-33.8966, 151.1798], 
        address: "194 King St, Newtown",
        desc: "An intimate 35-seat spot bringing bold, punchy Thai techniques and vibrant flavors like buttermilk roti and green mango salad.",
        url: "https://www.google.com/search?q=PIQU+Newtown+Sydney"
      },
      {
        id: 2,
        name: "Sugo",
        tag: "Generous Comfort Pasta Bar",
        coords: [-33.9422, 151.1215], 
        address: "Shop 3, 8/20 Sarsfield Cct, Bexley North",
        desc: "An effortlessly cool retro pasta bar serving handcrafted conchiglie, hearty cotoletta, and affordable Italian classics.",
        url: "https://www.google.com/search?q=Sugo+Bexley+North+Sydney"
      },
      {
        id: 3,
        name: "Duan Noodle House",
        tag: "Hand-Pulled Noodle Theater",
        coords: [-33.9118, 151.1554], 
        address: "Shop 2/359 Illawarra Rd, Marrickville",
        desc: "Watch fresh noodles hand-stretched before your eyes in rich, deeply comforting broths.",
        url: "https://www.google.com/search?q=Duan+Noodle+House+Marrickville"
      },
      {
        id: 4,
        name: "PST Australia (Pizza Studio Tamaki)",
        tag: "Cult Tokyo Neapolitan Pizza",
        coords: [-33.8643, 151.2069], 
        address: "259 George St, Sydney CBD",
        desc: "Direct from Tokyo, founder Tsubasa Tamaki serves exceptional woodfired pizza made with 30-hour fermented dough.",
        url: "https://www.google.com/search?q=Pizza+Studio+Tamaki+Sydney"
      },
      {
        id: 5,
        name: "Lo Presti's Restaurant",
        tag: "Italian & Moroccan Fusion",
        coords: [-33.8932, 151.2052], 
        address: "Level 1/34b Redfern St, Redfern",
        desc: "Created by Baba's Place alumni, offering rich Mediterranean plates balancing Moroccan spices with Italian flair.",
        url: "https://www.google.com/search?q=Lo+Prestis+Restaurant+Redfern"
      }
    ];

    const BRONTE_COORDS = [-33.9032, 151.2685];

    let map = null;
    let catMarker = null;
    let currentCatCoords = [...BRONTE_COORDS];
    let restaurantMarkers = [];

    // Miniature version of the cute SVG for the map marker
    const miniCatSVG = `
      <svg viewBox="0 0 200 200" width="100%" height="100%" overflow="visible">
        <ellipse cx="100" cy="145" rx="60" ry="50" fill="#2d3436" />
        <ellipse cx="100" cy="155" rx="35" ry="30" fill="#ffffff" />
        <ellipse cx="100" cy="85" rx="55" ry="45" fill="#2d3436" />
        <path d="M 55 60 Q 45 10 75 40 Z" fill="#2d3436" />
        <path d="M 60 55 Q 50 20 70 42 Z" fill="#ffb8b8" />
        <path d="M 145 60 Q 155 10 125 40 Z" fill="#2d3436" />
        <path d="M 140 55 Q 150 20 130 42 Z" fill="#ffb8b8" />
        <path d="M 100 115 Q 140 115 145 85 Q 150 70 125 70 Q 100 90 100 90 Q 100 90 75 70 Q 50 70 55 85 Q 60 115 100 115 Z" fill="#ffffff" />
        <ellipse cx="65" cy="95" rx="8" ry="5" fill="#ffb8b8" opacity="0.8" />
        <ellipse cx="135" cy="95" rx="8" ry="5" fill="#ffb8b8" opacity="0.8" />
        <ellipse cx="75" cy="75" rx="12" ry="16" fill="#000000" />
        <ellipse cx="125" cy="75" rx="12" ry="16" fill="#000000" />
        <ellipse cx="71" cy="69" rx="4" ry="6" fill="#ffffff" />
        <ellipse cx="121" cy="69" rx="4" ry="6" fill="#ffffff" />
        <path d="M 96 90 Q 100 93 104 90 Q 100 87 96 90 Z" fill="#ff758f" />
      </svg>
    `;

    // --- UNIVERSAL TRANSLATION ENGINE ---
    function translateText(str, lang) {
      if (lang === 'english') return str;
      
      return str.split(/(\s+)/).map(word => {
        if (!word.trim()) return word; // Preserve whitespace
        
        // Extract leading/trailing punctuation and emojis
        const match = word.match(/^([^a-zA-Z0-9]*)(.*?)([^a-zA-Z0-9]*)$/);
        if (!match) return word;
        
        let [ , prefix, core, suffix ] = match;
        
        if (!core) return word; // Only punctuation/emojis
        
        if (lang === 'prawnese') {
          return prefix + '🦐' + suffix;
        } else {
          // Meowish
          let isCapitalized = /^[A-Z]/.test(core);
          return prefix + (isCapitalized ? 'Meow' : 'meow') + suffix;
        }
      }).join('');
    }

    function updateAllDOMText() {
      // Update elements with data-en attribute
      document.querySelectorAll('[data-en]').forEach(el => {
        const originalText = el.getAttribute('data-en');
        if (originalText) {
          if(el.tagName === 'P' && originalText.startsWith('Address:')) {
             // Handle address bolding specifically
             const addrCore = originalText.replace('Address: ', '');
             el.innerHTML = `<strong>${translateText('Address:', currentLang)}</strong> ${translateText(addrCore, currentLang)}`;
          } else {
             el.innerText = translateText(originalText, currentLang);
          }
        }
      });

      // Update Map Tooltips
      if (restaurantMarkers.length > 0) {
        restaurantMarkers.forEach(item => {
          item.marker.unbindTooltip();
          item.marker.bindTooltip(`📍 ` + translateText(item.res.name, currentLang), { permanent: true, direction: 'bottom', offset: [0, 8] });
        });
      }

      if (catMarker) {
        catMarker.unbindTooltip();
        catMarker.bindTooltip(translateText("Lulu's Birthday Cat (Starting at Bronte)", currentLang), { permanent: false, direction: 'top' });
      }

      // Re-render currently spoken text
      if (displayedWords.length > 0) {
        renderSpeechBubble();
      }
    }

    // --- CAT TALKING LOGIC ---
    function startCatTalking() {
      if (isTalking) return;
      
      const bubble = document.getElementById('speechBubble');
      bubble.style.opacity = '1';
      document.getElementById('translateBar').style.display = 'flex';

      isTalking = true;
      wordIndex = 0;
      displayedWords = [];
      document.getElementById('speechText').innerText = '';

      // Set default lang UI on first run
      updateAllDOMText();

      talkInterval = setInterval(() => {
        if (wordIndex < baseSentence.length) {
          displayedWords.push(baseSentence[wordIndex]);
          renderSpeechBubble();
          wordIndex++;
        } else {
          clearInterval(talkInterval);
          isTalking = false;
        }
      }, 350);
    }

    function renderSpeechBubble() {
      const renderedText = displayedWords.map(w => translateText(w, currentLang)).join(' ');
      document.getElementById('speechText').innerText = renderedText;
    }

    // --- TRANSLATION CONTROLS ---
    function toggleTranslateMenu() {
      document.getElementById('translateOptions').classList.toggle('show');
    }

    function setLanguage(lang) {
      currentLang = lang;
      
      document.querySelectorAll('.translate-options .lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('data-en').toLowerCase().includes(lang)) {
          btn.classList.add('active');
        }
      });

      updateAllDOMText();
    }

    // --- MAP & CAT ANIMATION LOGIC ---
    function initMap() {
      map = L.map('map').setView([-33.89, 151.20], 12);

      // CartoDB Voyager with CSS filter for cartoony look
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        className: 'cartoony-tiles',
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Custom SVG Cat Icon
      const catIcon = L.divIcon({
        className: 'cat-map-marker-svg',
        html: miniCatSVG,
        iconSize: [45, 45],
        iconAnchor: [22, 22]
      });

      catMarker = L.marker(BRONTE_COORDS, { icon: catIcon, zIndexOffset: 1000 }).addTo(map);
      
      restaurants.forEach(res => {
        const marker = L.marker(res.coords).addTo(map);
        restaurantMarkers.push({ marker: marker, res: res });
        marker.on('click', () => onRestaurantClick(res));
      });
      
      // Initialize tooltips with current language
      updateAllDOMText();
    }

    function animateCatTravel(targetCoords, callback) {
      const startCoords = [...currentCatCoords];
      const duration = 1500; 
      const startTime = performance.now();

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing function for smoother travel
        const easeProgress = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

        const currentLat = startCoords[0] + (targetCoords[0] - startCoords[0]) * easeProgress;
        const currentLng = startCoords[1] + (targetCoords[1] - startCoords[1]) * easeProgress;

        catMarker.setLatLng([currentLat, currentLng]);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          currentCatCoords = [...targetCoords];
          if (callback) callback();
        }
      }

      requestAnimationFrame(step);
    }

    function onRestaurantClick(res) {
      animateCatTravel(res.coords, () => {
        showSummaryModal(res);
      });
    }

    // --- MODAL CONTROLS ---
    function showSummaryModal(res) {
      activeRestaurant = res;
      
      // Update data-en attributes for universal translation
      document.getElementById('resTitle').setAttribute('data-en', res.name);
      document.getElementById('resTag').setAttribute('data-en', res.tag);
      document.getElementById('resDesc').setAttribute('data-en', res.desc);
      document.getElementById('resAddr').setAttribute('data-en', "Address: " + res.address);
      document.getElementById('resLink').href = res.url;
      
      updateAllDOMText(); // Triggers translation of newly injected texts

      document.getElementById('backdrop').classList.add('active');
      document.getElementById('summaryCard').classList.add('active');
    }

    function closeModal() {
      document.getElementById('backdrop').classList.remove('active');
      document.getElementById('summaryCard').classList.remove('active');
      activeRestaurant = null;
    }

    // Initialize Map on Load
    window.onload = initMap;
  </script>
</body>
</html>
